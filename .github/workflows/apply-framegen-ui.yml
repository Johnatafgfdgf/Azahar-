name: Apply Azahar FrameGen UI

on:
  workflow_dispatch:
  push:
    branches: [framegen]
    paths:
      - "tools/apply_framegen_ui.py"
      - ".github/workflows/apply-framegen-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: framegen
          fetch-depth: 0
      - name: Apply source patches
        run: python3 tools/apply_framegen_ui.py
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/common/settings.h \
            src/common/settings.cpp \
            src/android/app/src/main/java/org/citra/citra_emu/features/settings/model/BooleanSetting.kt \
            src/android/app/src/main/java/org/citra/citra_emu/features/settings/model/IntSetting.kt \
            src/android/app/src/main/java/org/citra/citra_emu/features/settings/ui/SettingsFragmentPresenter.kt \
            src/android/app/src/main/res/values/strings.xml \
            src/android/app/src/main/res/values/arrays.xml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add integrated frame generation settings UI"
            git push origin HEAD:framegen
          fi
